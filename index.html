<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auraa - Personal AI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #0b1020;
  color: white;
  display: flex;
  justify-content: center;
  padding: 18px;
}

.app {
  width: 100%;
  max-width: 850px;
  min-height: 90vh;
  background: #131a30;
  border: 1px solid #34405f;
  border-radius: 24px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #34405f;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #a99aff;
}

.status {
  color: #7ee5b0;
  font-size: 12px;
  margin-top: 5px;
}

select {
  background: #222d4a;
  color: white;
  padding: 10px;
  border: 1px solid #52618a;
  border-radius: 10px;
}

.profile {
  text-align: center;
  padding: 30px 15px 15px;
}

.avatar {
  width: 115px;
  height: 115px;
  margin: auto;
  border-radius: 50%;
  background: linear-gradient(135deg,#a78bfa,#4c8dff);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 60px;
  box-shadow: 0 0 40px #806aff66;
}

.profile h2 {
  margin-top: 17px;
  font-size: 26px;
}

.profile p {
  color: #aab5d0;
  margin-top: 8px;
}

.chat {
  flex: 1;
  min-height: 240px;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.message {
  max-width: 85%;
  padding: 13px 16px;
  border-radius: 17px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.auraa {
  align-self: flex-start;
  background: #263252;
}

.user {
  align-self: flex-end;
  background: #6855c9;
}

.controls {
  padding: 18px;
  border-top: 1px solid #34405f;
}

.input-row {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #53618a;
  background: #202b48;
  color: white;
  font-size: 15px;
}

button {
  border: none;
  cursor: pointer;
  border-radius: 12px;
  padding: 12px 15px;
  color: white;
  background: #765ee7;
  font-size: 15px;
}

button:hover {
  filter: brightness(1.15);
}

.tools {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 15px;
  flex-wrap: wrap;
}

.tools button {
  background: #263252;
  border: 1px solid #48577d;
}

.note {
  text-align: center;
  font-size: 12px;
  color: #8997b7;
  margin-top: 15px;
}

footer {
  text-align: center;
  padding: 15px;
  color: #8997b7;
  font-size: 12px;
}

@media(max-width:500px) {
  body { padding: 5px; }
  .app { min-height: 98vh; border-radius: 15px; }
  header { padding: 15px; }
  .logo { font-size: 22px; }
  .profile { padding-top: 25px; }
  .avatar { width: 95px; height: 95px; font-size: 48px; }
  .message { max-width: 92%; }
  .controls { padding: 12px; }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <div class="logo">✦ Auraa</div>
    <div class="status" id="status">● Ready to assist</div>
  </div>

  <select id="language" onchange="changeLanguage()">
    <option value="en">English</option>
    <option value="ta">தமிழ்</option>
  </select>
</header>

<section class="profile">
  <div class="avatar">👩🏻‍💻</div>
  <h2>Auraa</h2>
  <p id="welcome">Your personal AI companion</p>
</section>

<div class="chat" id="chat">
  <div class="message auraa" id="greeting">
    Hello! I'm Auraa. How can I help you today? ✨
  </div>
</div>

<section class="controls">
  <div class="input-row">
    <input
      id="message"
      type="text"
      placeholder="Talk to Auraa..."
      onkeydown="if(event.key==='Enter') sendMessage()"
    >
    <button onclick="sendMessage()">➤</button>
  </div>

  <div class="tools">
    <button onclick="voiceInfo()">🎙️ Voice</button>
    <button onclick="cameraInfo()">📷 Camera</button>
    <button onclick="clearChat()">🗑️ Clear</button>
  </div>

  <p class="note" id="note">
    Voice, hand tracking and eye tracking will be added in future steps.
  </p>
</section>

<footer>Made with ♥ for your personal AI journey</footer>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const language = document.getElementById("language");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  setTimeout(() => {
    const isTamil = language.value === "ta";
    let reply;

    if (isTamil) {
      reply = "வணக்கம்! நான் Auraa. இது என்னுடைய ஆரம்ப டெமோ பதில். விரைவில் உண்மையான AI வசதியை இணைப்போம்! ✨";
    } else {
      reply = "Hello! I'm Auraa. This is my first demo response. We'll connect my real AI brain soon! ✨";
    }

    addMessage(reply, "auraa");
  }, 500);
}

function changeLanguage() {
  const tamil = language.value === "ta";

  document.getElementById("welcome").textContent =
    tamil ? "உங்கள் தனிப்பட்ட AI துணைவி" :
    "Your personal AI companion";

  document.getElementById("greeting").textContent =
    tamil ? "வணக்கம்! நான் Auraa. உங்களுக்கு எப்படி உதவலாம்? ✨" :
    "Hello! I'm Auraa. How can I help you today? ✨";

  input.placeholder = tamil ? "Auraa-விடம் பேசுங்கள்..." :
    "Talk to Auraa...";

  document.getElementById("note").textContent =
    tamil ? "குரல், கை அசைவு மற்றும் கண் கண்காணிப்பு பின்னர் சேர்க்கப்படும்." :
    "Voice, hand tracking and eye tracking will be added in future steps.";

  document.getElementById("status").textContent =
    tamil ? "● உதவத் தயார்" : "● Ready to assist";
}

function voiceInfo() {
  alert(language.value === "ta"
    ? "குரல் வசதியை அடுத்த படியில் சேர்ப்போம்!"
    : "We'll add real voice recognition in a later step!");
}

function cameraInfo() {
  alert(language.value === "ta"
    ? "கேமரா மற்றும் கை அசைவு கண்காணிப்பை பின்னர் சேர்ப்போம்!"
    : "We'll add camera, hand tracking and eye gaze in later steps!");
}

function clearChat() {
  chat.innerHTML = "";
  addMessage(
    language.value === "ta"
      ? "வணக்கம்! மீண்டும் வரவேற்கிறேன். ✨"
      : "Hello! Welcome back. ✨",
    "auraa"
  );
}
</script>

</body>
</html>
