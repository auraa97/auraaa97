<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const language = document.getElementById("language");

const WORKER_URL = "https://auraa-ai.think0557.workers.dev";

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, "user");
  input.value = "";
  input.disabled = true;

  const tamil = language.value === "ta";
  const status = document.getElementById("status");

  status.textContent = tamil
    ? "● பதில் தயாராகிறது..."
    : "● Auraa is thinking...";

  const typing = addMessage(
    tamil ? "சிறிது நேரம் காத்திருக்கவும்..." : "Thinking...",
    "auraa"
  );

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text,
        language: tamil ? "Tamil" : "English"
      })
    });

    const data = await response.json();

    typing.remove();

    if (!response.ok) {
      throw new Error(data.error || "AI request failed");
    }

    addMessage(
      data.reply || "Sorry, I couldn't create a reply.",
      "auraa"
    );

  } catch (error) {
    typing.remove();

    addMessage(
      tamil
        ? "மன்னிக்கவும்! இணைப்பில் சிக்கல் உள்ளது. மீண்டும் முயற்சிக்கவும்."
        : "Sorry! There is a connection problem. Please try again.",
      "auraa"
    );

    console.error("Auraa connection error:", error);

  } finally {
    input.disabled = false;
    input.focus();

    status.textContent = tamil
      ? "● உதவத் தயார்"
      : "● Ready to assist";
  }
}

function changeLanguage() {
  const tamil = language.value === "ta";

  document.getElementById("welcome").textContent =
    tamil ? "உங்கள் தனிப்பட்ட AI துணைவி" :
    "Your personal AI companion";

  document.getElementById("greeting").textContent =
    tamil ? "வணக்கம்! நான் Auraa. உங்களுக்கு எப்படி உதவலாம்? ✨" :
    "Hello! I'm Auraa. How can I help you today? ✨";

  input.placeholder = tamil ? "Auraa-விடம் பேசுங்கள்..." :
    "Talk to Auraa...";

  document.getElementById("note").textContent =
    tamil ? "குரல், கை அசைவு மற்றும் கண் கண்காணிப்பு பின்னர் சேர்க்கப்படும்." :
    "Voice, hand tracking and eye tracking will be added in future steps.";

  document.getElementById("status").textContent =
    tamil ? "● உதவத் தயார்" : "● Ready to assist";
}

function voiceInfo() {
  alert(language.value === "ta"
    ? "குரல் வசதியை அடுத்த படியில் சேர்ப்போம்!"
    : "We'll add real voice recognition in a later step!");
}

function cameraInfo() {
  alert(language.value === "ta"
    ? "கேமரா மற்றும் கை அசைவு கண்காணிப்பை பின்னர் சேர்ப்போம்!"
    : "We'll add camera, hand tracking and eye gaze in later steps!");
}

function clearChat() {
  chat.innerHTML = "";

  addMessage(
    language.value === "ta"
      ? "வணக்கம்! மீண்டும் வரவேற்கிறேன். ✨"
      : "Hello! Welcome back. ✨",
    "auraa"
  );
}
</script>
